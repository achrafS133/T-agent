[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tagent-pro"
version = "1.0.0"
description = "T-AGENT PRO — Multi-Agent LLM Trading Intelligence Framework"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "T-AGENT" }]
keywords = ["trading", "llm", "langgraph", "multi-agent", "finance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-ollama>=0.3.0",
    "langgraph>=0.4.0",
    "yfinance>=0.2.40",
    "pandas>=2.2.0",
    "stockstats>=0.6.0",
    "feedparser>=6.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.9.0",
    "tqdm>=4.66.0",
    "pydantic>=2.9.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.8.0", "pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[project.scripts]
tagent = "src.cli:run_cli"
tagent-serve = "serve:main"
tagent-backtest = "src.backtest:run_backtest"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
